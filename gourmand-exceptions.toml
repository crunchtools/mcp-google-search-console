
# Lint suppression — test intentionally passes invalid args to verify rejection
[[exceptions]]
check = "lint_suppression"
path = "tests/test_validation.py"
justification = "type: ignore[call-arg] is required to test that Pydantic rejects extra fields"
classification = "by_design"

[[exceptions]]
check = "primitive_obsession"
path = "src/mcp_google_search_console_crunchtools/__init__.py"
justification = "Port 8017 is a standard default for HTTP servers"
classification = "by_design"

# Single-use helper — extracting error body parsing avoids too-many-branches in _handle_error_response
[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_google_search_console_crunchtools/client.py"
justification = "Inlining _parse_error_body into _handle_error_response triggers PLR0912 (too many branches) — extraction is the correct fix for branch complexity"
classification = "by_design"

# Redundant error handling — the handler recovers by falling through, which the
# check's heuristic cannot see: a malformed cached expiry leaves _access_token
# unset, so the caller proceeds to refresh with the returned refresh_token. The
# log records why the cache was skipped. Removing the handler would propagate a
# corrupt-cache error to the user instead of transparently re-authenticating.
[[exceptions]]
check = "redundant_error_handling"
path = "src/mcp_google_search_console_crunchtools/client.py"
justification = "Handler recovers by falling through to the token refresh path; the log explains the skipped cache"
classification = "by_design"

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_google_search_console_crunchtools/client.py"
justification = "get_client and get_config are both the four-line lazy-singleton accessor: check the module global, construct if None, return. The duplication is the idiom; hiding it behind a generic obscures which global is being initialised."
classification = "by_design"

# Hidden env config — all five vars are documented in the Environment Variables
# table in CLAUDE.md and in README.md's setup walkthrough. Not adding names to
# allowed_names, per upstream guidance: this exception is the confirmation that
# each one is documented, not a silencing of the check.
[[exceptions]]
check = "hidden_env_config"
path = "src/mcp_google_search_console_crunchtools/config.py"
justification = "GSC_CLIENT_ID, GSC_CLIENT_SECRET, GSC_REFRESH_TOKEN, GSC_CREDENTIALS_DIR, and GSC_OAUTH_REDIRECT_URI are documented in CLAUDE.md's Environment Variables table and in README.md's setup instructions"
classification = "by_design"

# Manifest lint suppression — every ignore below is a project-wide style choice
# (not a quality/correctness lint) with an inline comment stating the reason:
# long exception messages, MCP tool signatures mirroring the wire API's
# positional/keyword shape, HTTP status codes as literals, the module-global
# singleton pattern, empty-class bodies, a deferred import that avoids a
# circular import, a ruff false-positive on *_TOKEN_ENDPOINT naming, relative
# imports within the package, and __all__ grouped by category. S101 (assert)
# was moved to a tests-only per-file-ignore since it never fires in src/.
[[exceptions]]
check = "manifest_lint_suppression"
path = "pyproject.toml"
justification = "The project-wide ruff ignore list has had no line-by-line review. The claim previously recorded here -- that these are all style choices rather than quality or correctness lints -- is false: S105 is a flake8-bandit SECURITY rule, and PLR2004, PLC0415 and PLW0603 are correctness and structural rules. Several inline comments also describe a single file or test-only situation while the ignore is applied project-wide. Classified as accepted debt, not design, so it keeps counting against this repo's score until a fleet-wide ruff policy is decided (RT #1482)."
classification = "accepted_bad_taste"
